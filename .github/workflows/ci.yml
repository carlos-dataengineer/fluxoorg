name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Arquivos gerados em dia
        run: python scripts/build.py --check
      - name: Skill, plugin, instaladores, exemplos e README
        run: python tests/validate_repo.py
      - name: Spec de exemplo válida
        run: python skills/fluxoorg/scripts/render.py examples/orbita.spec.json --check
      - name: Sintaxe dos scripts bash
        run: bash -n install.sh && bash -n uninstall.sh
      - name: ShellCheck
        run: shellcheck --severity=warning install.sh uninstall.sh

  navegador:
    name: Testes no navegador
    runs-on: ubuntu-latest
    needs: validar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Motor de análise
        run: python tests/test_engine.py
      - name: Fumaça da interface
        run: python tests/test_smoke.py

  instalar-unix:
    name: Instalação (${{ matrix.os }})
    needs: validar
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar a partir do clone
        run: bash install.sh --no-open
      - name: Conferir arquivos
        run: |
          test -f "$HOME/.claude/skills/fluxoorg/SKILL.md"
          test -f "$HOME/.codex/skills/fluxoorg/assets/fluxoorg.html"
          test -f "$HOME/.agents/skills/fluxoorg/references/FORMATO.md"
          test -f "$HOME/Fluxoorg/fluxoorg.html"
      - name: A skill instalada gera um fluxo
        run: python3 "$HOME/.claude/skills/fluxoorg/scripts/render.py" examples/orbita.spec.json -o "$RUNNER_TEMP/orbita.html"
      - name: Reinstalar (idempotente)
        run: bash install.sh --no-open
      - name: Desinstalar
        run: |
          bash uninstall.sh --all
          test ! -e "$HOME/.claude/skills/fluxoorg"
          test ! -e "$HOME/Fluxoorg/fluxoorg.html"

  instalar-windows:
    name: Instalação (Windows PowerShell 5.1)
    needs: validar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar a partir do clone
        shell: powershell
        run: .\install.ps1 -NoOpen
      - name: Instalar como "irm | iex" (texto do script)
        shell: powershell
        run: |
          $env:FLUXOORG_NO_OPEN = '1'
          Get-Content .\install.ps1 -Raw | Invoke-Expression
      - name: Conferir arquivos
        shell: powershell
        run: |
          foreach ($p in "$HOME\.claude\skills\fluxoorg\SKILL.md", "$HOME\.codex\skills\fluxoorg\SKILL.md", "$HOME\Fluxoorg\fluxoorg.html") {
            if (-not (Test-Path $p)) { throw "faltando: $p" }
          }
      - name: Desinstalar
        shell: powershell
        run: |
          .\uninstall.ps1 -All
          if (Test-Path "$HOME\.claude\skills\fluxoorg") { throw 'skill nao removida' }
