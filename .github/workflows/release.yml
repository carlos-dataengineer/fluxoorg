name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    name: Publicar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Conferir versão da tag
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || { echo "A tag ${GITHUB_REF_NAME} difere de VERSION $(cat VERSION)"; exit 1; }
      - name: Validar
        run: |
          python scripts/build.py --check
          python tests/validate_repo.py
      - name: Empacotar
        run: |
          mkdir -p dist
          (cd skills && zip -r ../dist/fluxoorg-skill.zip fluxoorg)
          cp app/index.html dist/fluxoorg.html
      - name: Notas da versão a partir do CHANGELOG
        run: |
          awk -v v="$(cat VERSION)" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > dist/notas.md
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/fluxoorg-skill.zip dist/fluxoorg.html \
            --title "Fluxoorg ${GITHUB_REF_NAME}" --notes-file dist/notas.md
