name: Demo no GitHub Pages

# Publica app/index.html em https://carlos-dataengineer.github.io/fluxoorg/
# Na primeira vez: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["app/**", "docs/images/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Montar o site
        run: |
          mkdir -p site
          cp app/index.html site/index.html
          cp docs/images/social.png site/social.png 2>/dev/null || true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
